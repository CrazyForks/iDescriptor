name: Build Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Build version (e.g., v1.2.3)"
        required: true
        default: "dev"
  workflow_call:
    inputs:
      version:
        description: "Build version (e.g., v1.2.3)"
        required: true
        type: string
        default: "dev"
env:
  QT_VERSION: "6.9.3"
  GST_PLUGINS_GOOD_VERSION: "1.26.2"
  LIBPLIST_VER: "2.7.0"
  LIBTATSU_VER: "1.0.5"
  LIBIMOBILEDEVICE_GLUE_VER: "1.3.2"
  LIBIMOBILEDEVICE_VER: "1.4.0"
  LIBIRECOVERY_VER: "1.3.1"
  LIBUSBMUXD_VER: "2.1.1"

jobs:
  build-windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          release: false
          update: false

      - name: Use msys2 archive
        shell: pwsh
        run: |
          $date = "2025-06-22"
          & "./util/get-msys2-archive.ps1" -Date $date

      - name: Install deps using pacman
        run: |
          pacman -S --needed --noconfirm \
          coreutils \
          base-devel \
          git \
          make \
          libtool \
          autoconf \
          automake-wrapper \
          p7zip \
          mingw-w64-x86_64-gcc \
          mingw-w64-x86_64-cmake \
          mingw-w64-x86_64-meson \
          mingw-w64-x86_64-ninja \
          mingw-w64-x86_64-pkgconf \
          mingw-w64-x86_64-pugixml \
          mingw-w64-x86_64-libusb \
          mingw-w64-x86_64-qrencode \
          mingw-w64-x86_64-curl \
          mingw-w64-x86_64-openssl \
          mingw-w64-x86_64-libzip \
          mingw-w64-x86_64-gstreamer \
          mingw-w64-x86_64-gst-plugins-base \
          mingw-w64-x86_64-gst-plugins-good \
          mingw-w64-x86_64-gst-plugins-bad \
          mingw-w64-x86_64-gst-plugins-ugly \
          mingw-w64-x86_64-gst-libav \
          mingw-w64-x86_64-libheif \
          mingw-w64-x86_64-libarchive \
          mingw-w64-x86_64-rustup

      - name: Setup rust toolchain
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu
          rustup default stable-x86_64-pc-windows-gnu
          rustup toolchain list

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          modules: "qtmultimedia qtlocation qtpositioning qtserialport qt5compat qtshadertools"
          arch: win64_mingw

      - name: Set Environment Variables
        run: |
          qt_root_dir="$(cygpath -au "${Qt6_DIR:?Qt6_DIR is not set}")"
          echo "QMAKE=${qt_root_dir}/bin/qmake.exe" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_EXECUTABLE=C:/msys64/mingw64/bin/pkg-config.exe" >> $GITHUB_ENV

      - name: Install FluentUI
        run: |
          qt_root_dir="$(cygpath -au "${Qt6_DIR:?Qt6_DIR is not set}")"

          git clone https://github.com/uncor3/FluentUI.git
          cd FluentUI
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${qt_root_dir}" \
            -DFLUENTUI_QML_PLUGIN_DIRECTORY="${qt_root_dir}/qml/FluentUI"
          cmake --build build

      - name: Build qml6glsink from gst-plugins-good
        run: |
          qt_root_dir="$(cygpath -au "${Qt6_DIR:?Qt6_DIR is not set}")"

          curl --retry 3 --retry-delay 5 -L \
            -o "gst-plugins-good-${GST_PLUGINS_GOOD_VERSION}.tar.xz" \
            "https://gstreamer.freedesktop.org/src/gst-plugins-good/gst-plugins-good-${GST_PLUGINS_GOOD_VERSION}.tar.xz"
          tar -xf "gst-plugins-good-${GST_PLUGINS_GOOD_VERSION}.tar.xz"
          cd "gst-plugins-good-${GST_PLUGINS_GOOD_VERSION}"

          meson setup build-qml6 . \
            --prefix=/mingw64 \
            --libdir=lib \
            --auto-features=disabled \
            -Dqt-method=qmake \
            -Dqt6=enabled \
            -Dqt5=disabled \
            -Dtests=disabled \
            -Dexamples=disabled \
            -Dnls=disabled

          ninja -C build-qml6
          cp build-qml6/ext/qt6/libgstqml6.dll /mingw64/lib/gstreamer-1.0/

      - name: Install WinFsp
        shell: pwsh
        run: |
          $maxRetries = 3
          $retryDelaySeconds = 10
          $attempt = 0
          $success = $false

          while ($attempt -lt $maxRetries -and -not $success) {
              $attempt++
              Write-Host "Attempt $attempt to install WinFsp..."
              choco install winfsp -y
              if ($LASTEXITCODE -eq 0) {
                  Write-Host "WinFsp installed successfully on attempt $attempt."
                  $success = $true
              } else {
                  Write-Warning "WinFsp installation failed on attempt $attempt (exit code: $LASTEXITCODE)."
                  if ($attempt -lt $maxRetries) {
                      Write-Host "Retrying in $retryDelaySeconds seconds..."
                      Start-Sleep -Seconds $retryDelaySeconds
                  }
              }
          }

          if (-not $success) {
              Write-Error "Failed to install WinFsp after $maxRetries attempts."
              exit 1 # Explicitly fail the step if all retries fail
          }

      - name: Download and Extract Bonjour SDK
        run: |
          curl --retry 3 --retry-delay 5 -L \
            -o bonjour-sdk.exe \
            "https://github.com/tempx-x/bonjour-sdk/raw/refs/heads/main/bonjoursdksetup.exe"

          EXPECTED_HASH="4ff2aae8205aec31b06743782cfcadce"
          ACTUAL_HASH=$(md5sum bonjour-sdk.exe | awk '{print $1}')

          echo "Expected MD5: $EXPECTED_HASH"
          echo "Actual MD5:   $ACTUAL_HASH"

          if [ "$ACTUAL_HASH" != "$EXPECTED_HASH" ]; then
            echo "::error::Checksum mismatch!"
            exit 1
          fi

          echo "Checksum verified. Extracting installer..."
          7z x bonjour-sdk.exe -oBonjourInstaller

      - name: Install Bonjour Runtime
        shell: powershell
        run: |
          $currentPath = Get-Location
          $msiFilePath = Join-Path -Path $currentPath -ChildPath "BonjourInstaller\Bonjour64.msi"
          $msiexecArguments = "/i `"$msiFilePath`" /qn"
          Write-Host "Installing Bonjour Runtime..."
          Start-Process msiexec -ArgumentList $msiexecArguments -NoNewWindow -Wait

      - name: Install Bonjour SDK
        shell: powershell
        run: |
          $currentPath = Get-Location
          $msiFilePath = Join-Path -Path $currentPath -ChildPath "BonjourInstaller\BonjourSDK64.msi"
          $msiexecArguments = "/i `"$msiFilePath`" /qn"
          Write-Host "Installing Bonjour SDK..."
          Start-Process msiexec -ArgumentList $msiexecArguments -NoNewWindow -Wait

          "BONJOUR_SDK_HOME=C:/Program Files/Bonjour SDK" | Out-File -FilePath $env:GITHUB_ENV -Append


      - name: Build libimobiledevice suite (versioned tarballs)
        run: |
          workspace="$PWD"
          tmp="$PWD/_tmp_libs"
          mkdir -p "$tmp"
          cd "$tmp"

          base_url="https://github.com/libimobiledevice"

          libs=( "libplist" )

          for name in "${libs[@]}"; do
            ver_var=$(echo "${name^^}_VER" | sed 's/-/_/g')
            ver="${!ver_var:-}"
            if [ -z "$ver" ]; then
              echo "Version for $name not set (env var $ver_var)"
              exit 1
            fi

            archive="${name}-${ver}.tar.bz2"
            url="${base_url}/${name}/releases/download/${ver}/${archive}"
            echo "=== Processing $name $ver ==="
            echo "URL: $url"
            curl --retry 3 --retry-delay 5 -L -o "$archive" "$url"

            echo "Extracting $archive"
            tar xjf "$archive"

            srcdir="${name}-${ver}"
            pushd "$srcdir"

            ./configure --without-cython
            make -j"$(nproc)"
            make install
            popd
            echo "Installed $name $ver"
          done

          # cleanup
          cd "$workspace"
          rm -rf "$tmp"

      - name: Build
        run: |
          RUSTFLAGS="" cargo build --release

      - name: Deploy portable build
        run: |
          rm -rf target/deploy
          mkdir -p target/deploy
          cp target/release/idescriptor.exe target/deploy/

          qt_root_dir="$(cygpath -au "${Qt6_DIR:?Qt6_DIR is not set}")"
          qml_source_dir="$(cygpath -au "$GITHUB_WORKSPACE")/src/ui"

          pushd target/deploy
          ../../scripts/deploy-exe.sh \
            --executable="./idescriptor.exe" \
            --output-dir="./" \
            --qt-bin-path="${qt_root_dir}/bin" \
            --win-ifuse="./" \
            --project-source-dir="../../" \
            --qml-source-dir="${qml_source_dir}"
          popd

      - name: Create portable ZIP
        id: portable_zip
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          $zipName = "iDescriptor-$version-Windows_x86_64.portable.zip"
          if (Test-Path $zipName) {
              Remove-Item $zipName
          }
          Compress-Archive -Path "target\deploy\*" -DestinationPath $zipName -Force
          "zip_name=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "zip_path=$((Resolve-Path $zipName).Path)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.portable_zip.outputs.zip_name }}
          path: ${{ steps.portable_zip.outputs.zip_path }}
