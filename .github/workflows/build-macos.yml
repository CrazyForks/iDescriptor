name: Build macOS

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Build version (for example, v1.2.3)"
        required: true
        default: "v0.0.0"
        type: string
  workflow_call:
    inputs:
      version:
        description: "Build version (for example, v1.2.3)"
        required: true
        type: string

env:
  QT_VERSION: "6.9.2"
  LIBPLIST_VER: "2.7.0"
  LIBTATSU_VER: "1.0.5"
  LIBIMOBILEDEVICE_GLUE_VER: "1.3.2"
  LIBIMOBILEDEVICE_VER: "1.4.0"
  LIBUSBMUXD_VER: "2.1.1"

jobs:
  build-macos:
    name: macOS ${{ matrix.arch }}
    environment: release
    env:
      HAS_MACOS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_BASE64 != '' }}
      HAS_MACOS_NOTARIZATION: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: "qtmultimedia qtlocation qtpositioning qtserialport qt5compat qtshadertools"

      - name: Update build paths
        run: |
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=${QT_ROOT_DIR}/lib/cmake:${CMAKE_PREFIX_PATH:-}" >> "$GITHUB_ENV"

      - name: Install macOS dependencies
        run: |
          brew install \
            autoconf \
            automake \
            pkg-config \
            create-dmg \
            curl \
            ffmpeg \
            gst-libav \
            gst-plugins-bad \
            gst-plugins-base \
            gst-plugins-good \
            gst-plugins-ugly \
            gstreamer \
            jpeg-xl \
            sqlite

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build libimobiledevice suite
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/idescriptor-libs"
          mkdir -p "$tmp"
          cd "$tmp"
          base_url="https://github.com/libimobiledevice"
          libs=(libplist)

          for name in "${libs[@]}"; do
            ver_var=$(echo "$name" | tr '[:lower:]' '[:upper:]' | sed 's/-/_/g')_VER
            ver="${!ver_var:-}"
            if [ -z "$ver" ]; then
              echo "Version for $name not set (environment variable $ver_var)"
              exit 1
            fi
            archive="${name}-${ver}.tar.bz2"
            curl --retry 3 --retry-delay 5 -L -o "$archive" \
              "${base_url}/${name}/releases/download/${ver}/${archive}"
            tar xjf "$archive"
            pushd "${name}-${ver}"
            ./configure
            make -j"$(sysctl -n hw.ncpu)"
            sudo make install
            popd
          done

      - name: Import signing certificate
        if: ${{ env.HAS_MACOS_SIGNING == 'true' }}
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          certificate="$RUNNER_TEMP/idescriptor-signing.p12"
          keychain="$RUNNER_TEMP/idescriptor-signing.keychain-db"
          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p actions "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p actions "$keychain"
          security import "$certificate" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$keychain"

      - name: Build with Cargo
        run: RUSTFLAGS="" cargo build --release

      - name: Deploy and create DMG
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: bash packaging/macos/dmg/deploy.sh "${{ matrix.arch }}" "${{ inputs.version }}"

      - name: Notarize DMG
        if: ${{ env.HAS_MACOS_NOTARIZATION == 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          dmg="build/iDescriptor-${{ inputs.version }}-${{ matrix.arch == 'x86_64' && 'Apple_Intel' || 'Apple_Silicon' }}.dmg"
          xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$dmg"

      - name: Validate DMG
        run: |
          file build/iDescriptor.app/Contents/MacOS/iDescriptor | grep -q "${{ matrix.arch }}"
          plutil -lint build/iDescriptor.app/Contents/Info.plist
          test -f build/iDescriptor-${{ inputs.version }}-${{ matrix.arch == 'x86_64' && 'Apple_Intel' || 'Apple_Silicon' }}.dmg

      - name: Upload updater artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: build/iDescriptor-${{ inputs.version }}-${{ matrix.arch == 'x86_64' && 'Apple_Intel' || 'Apple_Silicon' }}.dmg
          if-no-files-found: error
