name: Build Linux

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Build version (e.g., v1.2.3)"
        required: true
        default: "dev"
  workflow_call:
    inputs:
      version:
        description: "Build version (e.g., v1.2.3)"
        required: true
        type: string
        default: "dev"
env:
  QT_VERSION: "6.9.2"
  GO_VERSION: "1.23.4"
  LIBPLIST_VER: "2.7.0"
  LIBTATSU_VER: "1.0.5"
  LIBIMOBILEDEVICE_GLUE_VER: "1.3.2"
  LIBIMOBILEDEVICE_VER: "1.4.0"
  LIBIRECOVERY_VER: "1.3.1"
  IFUSE_VER: "1.2.0"
  LIBUSBMUXD_VER: "2.1.1"

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            automake \
            checkinstall \
            git \
            ninja-build \
            pkg-config \
            libpugixml-dev \
            libusb-1.0-0-dev \
            libqrencode-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libtool-bin \
            libreadline-dev \
            libavahi-compat-libdnssd-dev \
            libavcodec-dev \
            libavutil-dev \
            libswscale-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-gl \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            gstreamer1.0-alsa \
            gstreamer1.0-pulseaudio \
            gstreamer1.0-pipewire \
            libfuse2 \
            libunwind-dev \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            libheif-dev \
            libzip-dev \
            libssh-dev \
            libfuse3-dev \
            libavformat-dev \
            libavcodec-dev \
            libavutil-dev \
            libswscale-dev \
            python3-pip 

      - name: Install Meson
        run: |
          python3 -m pip install --user "meson==1.11.2"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          modules: "qtmultimedia qtlocation qtpositioning qtserialport qt5compat qtshadertools"
          dir: ${{ github.workspace }}

      - name: Build qml6glsink for GStreamer 1.20
        shell: bash
        run: |
          set -euo pipefail

          archive="gst-plugins-good-1.22.12.tar.xz"
          wget "https://gstreamer.freedesktop.org/src/gst-plugins-good/${archive}"
          echo "9c1913f981900bd8867182639b20907b28ed78ef7a222cfbf2d8ba9dab992fa7  ${archive}" | sha256sum --check
          tar -xf "${archive}"
          cd gst-plugins-good-1.22.12

          patch -p1 < "${GITHUB_WORKSPACE}/.github/patches/gst-plugins-good-1.22-gstreamer-1.20.patch"

          meson setup build-qml6 . \
            --prefix=/usr \
            --libdir="lib/$(uname -m)-linux-gnu" \
            --auto-features=disabled \
            -Dqt6=enabled \
            -Dqt5=disabled \
            -Dqt-x11=enabled \
            -Dtests=disabled \
            -Dexamples=disabled \
            -Dnls=disabled

          ninja -C build-qml6
          GST_PLUGIN_PATH_1_0="${PWD}/build-qml6/ext/qt6" \
            gst-inspect-1.0 qml6glsink >/dev/null
          sudo cp build-qml6/ext/qt6/libgstqml6.so \
            "/usr/lib/$(uname -m)-linux-gnu/gstreamer-1.0/"

      - name: Build libimobiledevice suite (versioned tarballs)
        run: |
          set -euo pipefail
          workspace="$PWD"
          tmp="$PWD/_tmp_libs"
          mkdir -p "$tmp"
          cd "$tmp"

          base_url="https://github.com/libimobiledevice"

          libs=( "libplist" "libtatsu" "libimobiledevice-glue" "libusbmuxd" "libimobiledevice" "libirecovery"  "ifuse" )

          for name in "${libs[@]}"; do
            ver_var=$(echo "${name^^}_VER" | sed 's/-/_/g')   # e.g. LIBPLIST_VER
            ver="${!ver_var:-}"
            if [ -z "$ver" ]; then
              echo "Version for $name not set (env var $ver_var)"
              exit 1
            fi

            archive="${name}-${ver}.tar.bz2"
            url="${base_url}/${name}/releases/download/${ver}/${archive}"
            echo "=== Processing $name $ver ==="
            echo "URL: $url"
            curl --retry 3 --retry-delay 5 -L -o "$archive" "$url"

            echo "Extracting $archive"
            tar xjf "$archive"

            srcdir="${name}-${ver}"
            pushd "$srcdir"

            ./configure


            make -j"$(nproc)" && sudo make install
            popd
            echo "Installed $name $ver"
          done

          # cleanup
          cd "$workspace"
          rm -rf "$tmp"

      - name: Update linker cache
        run: sudo ldconfig

      - name: Build
        run: |
          RUSTFLAGS="" cargo build --release --features appimage
          

      - name: Build AppImage
        run: |
          export VERSION=${{ inputs.version }}
          # linuxdeployqt tries to bundle SQL drivers which we don't need
          rm -rf ${{ github.workspace }}/Qt/{${{ env.QT_VERSION }}/gcc_64/plugins/sqldrivers/**
          ./scripts/deploy-appimage.sh ${{ inputs.version }}

      - name: Upload Artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: iDescriptor-AppImage
          path: iDescriptor-*.AppImage.zip
